spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.leak-detection-threshold=10000

app.jwt.secret=${APP_JWT_SECRET:dev-only-change-in-prod-min-32-characters-long!!}

logging.level.com.promssac.backend=DEBUG
logging.level.org.springframework.web=DEBUG

promssac.entel.onway.enabled=true
promssac.entel.onway.cookie=${PROMSSAC_ENTEL_ONWAY_COOKIE}
