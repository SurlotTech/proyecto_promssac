spring.application.name=promssac-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://5.78.157.191:5432/prueba_promssac}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:giomar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:giomar2003@}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=0

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=10

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
