spring.application.name=promssac-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://5.78.157.191:5432/prueba_promssac}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:giomar}
