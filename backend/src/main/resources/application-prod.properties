spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.leak-detection-threshold=0

app.error.include-details=false
logging.level.com.promssac.backend=WARN
logging.level.org.springframework.web=WARN

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://promssac.sulortech.com}
promssac.resend.frontend-url=${FRONTEND_URL:https://promssac.sulortech.com}
