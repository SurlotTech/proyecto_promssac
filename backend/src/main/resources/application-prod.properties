spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.leak-detection-threshold=0

logging.level.com.promssac.backend=WARN
logging.level.org.springframework.web=WARN

promssac.entel.onway.enabled=${PROMSSAC_ENTEL_ONWAY_ENABLED:true}
promssac.entel.onway.cookie=${PROMSSAC_ENTEL_ONWAY_COOKIE}

promssac.factiliza.api-token=${PROMSSAC_FACTILIZA_TOKEN}

app.jwt.secret=${APP_JWT_SECRET}
app.error.include-details=false
